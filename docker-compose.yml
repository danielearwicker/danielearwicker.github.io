# One image does everything: serves the site and renders its TikZ diagrams.
#
#   docker compose up
#
# builds the image on first run (a few minutes, cached thereafter), then serves
# on http://localhost:8080 with live reload. Editing a post -- diagrams included
# -- is picked up automatically; TikZ blocks are compiled to SVG by
# _plugins/tikz.rb and cached under assets/img/tikz/, which is committed so that
# CI, which has no TeX, can build the site from those files alone.
services:
  jekyll:
    build: .
    # A locally built image, because the published al-folio image has no TeX in
    # it. Naming it here keeps the build cached between runs.
    image: al-folio-tikz:local
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    # The base image's entry point serves without --future, which hides any
    # post dated after today -- i.e. tomorrow's draft. Production is unaffected:
    # CI builds without --future, so scheduled posts still wait for their date.
    # This runs the same `jekyll serve` as the entry point, minus its
    # restart-on-_config.yml-change loop: restart the container after editing
    # _config.yml.
    command:
      - bash
      - -c
      - >-
        git config --global --add safe.directory '*' &&
        exec bundle exec jekyll serve --watch --port=8080 --host=0.0.0.0
        --livereload --future --verbose --trace --force_polling
